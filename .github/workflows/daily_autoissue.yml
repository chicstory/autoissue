name: Daily AutoIssue Collector

on:
  schedule:
    # 매일 한국 시간 오전 07:30 (UTC 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-autoissue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AutoIssue Collector
        run: python auto_issue_collector.py

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/issues.json data/latest_stats.json
          if git diff --staged --quiet; then
            echo "No new autoissue changes detected."
          else
            git commit -m "chore(autoissue): daily recall & news update $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
